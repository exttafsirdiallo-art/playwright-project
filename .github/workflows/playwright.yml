name: Playwright Tests (with Email)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test_and_mail:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=chromium

      - name: Zip Playwright report
        if: always()
        run: |
          rm -f playwright-report.zip
          [ -d "playwright-report" ] && zip -r playwright-report.zip playwright-report || echo "No report dir."

      - name: Send report by email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          # --- Mets ICI tes valeurs en DUR (pas d'expressions) ---
          server_address: in-v3.mailjet.com # <-- remplace par ton serveur SMTP (ex: smtp.gmail.com)
          server_port: 587 # <-- 587 = STARTTLS ; si tu utilises 465, mets 465 + secure: true
          secure: false # <-- true si tu utilises le port 465 (TLS direct)
          from: "CI <ext.tafsir.diallo@gmail.com>" # <-- ton expéditeur
          to: "ext.tafsir.diallo@blancheporte.fr" # <-- destinataire(s), séparés par des virgules si plusieurs
          # --- Secrets sensibles uniquement ici ---
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Playwright – ${{ job.status }} – ${{ github.ref_name }}"
          html_body: |
            <p>Bonjour,</p>
            <p>Rapport Playwright pour la branche <b>${{ github.ref_name }}</b>.</p>
            <p>Statut: <b>${{ job.status }}</b></p>
            <p>Run: <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">ouvrir sur GitHub</a></p>
            <p>Cordialement,<br/>CI</p>
          attachments: |
            playwright-report.zip
