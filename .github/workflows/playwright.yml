name: Playwright Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  smoke:
    name: Run Smoke Tests (@smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --grep "@smoke" --project=chromium
      - name: Zip smoke report
        if: always()
        run: |
          rm -f playwright-report.zip
          [ -d "playwright-report" ] && zip -r playwright-report.zip playwright-report || echo "No report dir."
      - name: Upload smoke report (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-zip
          path: playwright-report.zip
          if-no-files-found: warn

  full:
    name: Run Full Suite
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=chromium
      - name: Zip full report
        if: always()
        run: |
          rm -f playwright-report.zip
          [ -d "playwright-report" ] && zip -r playwright-report.zip playwright-report || echo "No report dir."
      - name: Upload full report (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report-zip
          path: playwright-report.zip
          if-no-files-found: warn
